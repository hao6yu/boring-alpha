[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "boring-alpha"
version = "0.1.0"
description = "A skeptical, reproducible laboratory for systematic trading research."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BoringAlpha contributors" }]
dependencies = []

[project.scripts]
boring-alpha = "boring_alpha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
