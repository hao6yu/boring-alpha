# Evaluation period boundaries, transcribed from the strategy charters.
#
# A run configuration names a period; it never restates these dates. The loader
# resolves the bounds here, refuses a backtest window that falls outside them,
# and truncates the dataset at the period end so data after the boundary is
# never loaded. Changing a boundary is a charter change: amend the charter and
# its change log in the same commit.

[BA-001.development]
start = 2007-01-01
end = 2017-12-31

[BA-001.validation]
start = 2018-01-01
end = 2021-12-31

[BA-001.sealed]
start = 2022-01-01
end = 2025-12-31
