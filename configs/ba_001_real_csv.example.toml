# Copy this file to a local, untracked configuration after preparing real data.

[strategy]
id = "BA-001"
name = "Multi-Asset Trend"
symbols = ["SPY", "IWM", "EFA", "EEM", "IEF", "TLT", "GLD", "DBC"]
lookback_months = 12
sleeve_weight = 0.125

[portfolio]
initial_cash = 100000.0

[execution]
cost_bps = 10.0

[data]
source = "csv"
prices_path = "../data/market_daily.csv"
cash_path = "../data/cash_daily.csv"

[backtest]
start = "2007-01-01"
end = "2017-12-31"

[evaluation]
period = "development"

[report]
output_dir = "../experiments"
